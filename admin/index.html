<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin · Warqaa Nazar</title>
  <link rel="stylesheet" href="css/admin.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase-client.js"></script>
</head>
<body>

<div id="app">

  <!-- ─── SIDEBAR ──────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-arabic">ورقاء نزار</span>
      <span class="brand-sub">Admin Panel</span>
    </div>

    <nav class="sidebar-nav">

      <button class="nav-item active" data-nav="essays">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
          <line x1="2" y1="4" x2="12" y2="4"/><line x1="2" y1="7" x2="12" y2="7"/>
          <line x1="2" y1="10" x2="8" y2="10"/>
        </svg>
        Essays
      </button>

      <button class="nav-item" data-nav="designs">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1.5" y="1.5" width="4.5" height="4.5" rx="0.5"/>
          <rect x="8"   y="1.5" width="4.5" height="4.5" rx="0.5"/>
          <rect x="1.5" y="8"   width="4.5" height="4.5" rx="0.5"/>
          <rect x="8"   y="8"   width="4.5" height="4.5" rx="0.5"/>
        </svg>
        Designs
      </button>

      <button class="nav-item" data-nav="decorations">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
          <circle cx="7" cy="7" r="2"/>
          <ellipse cx="7" cy="3" rx="1.2" ry="2"/>
          <ellipse cx="7" cy="3" rx="1.2" ry="2" transform="rotate(60 7 7)"/>
          <ellipse cx="7" cy="3" rx="1.2" ry="2" transform="rotate(120 7 7)"/>
          <ellipse cx="7" cy="3" rx="1.2" ry="2" transform="rotate(180 7 7)"/>
          <ellipse cx="7" cy="3" rx="1.2" ry="2" transform="rotate(240 7 7)"/>
          <ellipse cx="7" cy="3" rx="1.2" ry="2" transform="rotate(300 7 7)"/>
        </svg>
        Decorations
      </button>

      <button class="nav-item" data-nav="settings">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
          <circle cx="7" cy="7" r="2"/>
          <line x1="7" y1="1"  x2="7"  y2="3.5"/>
          <line x1="7" y1="10.5" x2="7" y2="13"/>
          <line x1="1"  y1="7" x2="3.5" y2="7"/>
          <line x1="10.5" y1="7" x2="13" y2="7"/>
        </svg>
        Settings
      </button>

      <button class="nav-item" data-nav="upload">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 9V2M4 5l3-3 3 3"/>
          <path d="M2 10v1.5A1.5 1.5 0 0 0 3.5 13h7A1.5 1.5 0 0 0 12 11.5V10"/>
        </svg>
        Upload Tool
      </button>

    </nav>

    <div class="sidebar-footer">
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px">
        <button class="action-btn" id="export-btn" style="width:100%;justify-content:center">Export backup</button>
        <label class="action-btn" for="import-input" style="width:100%;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center">Import backup</label>
        <input type="file" id="import-input" accept=".json" style="display:none"/>
      </div>
      <button class="logout-btn" id="logout-btn">Logout</button>
    </div>
  </aside>

  <!-- ─── MAIN CONTENT ─────────────────────────────────── -->
  <main class="main-content">

    <!-- ESSAYS -->
    <section class="section active" id="section-essays">
      <div class="section-head">
        <div>
          <h1>Essays</h1>
          <p class="sub">Your written work</p>
        </div>
        <button class="btn btn-primary" id="add-essay-btn">+ New Essay</button>
      </div>
      <div id="essays-list"></div>
    </section>

    <!-- DESIGNS -->
    <section class="section" id="section-designs">
      <div class="section-head">
        <div>
          <h1>Designs</h1>
          <p class="sub">Portfolio projects</p>
        </div>
        <button class="btn btn-primary" id="add-design-btn">+ New Design</button>
      </div>
      <div id="designs-list"></div>
    </section>

    <!-- DECORATIONS -->
    <section class="section" id="section-decorations">
      <div class="section-head">
        <div>
          <h1>Decorations</h1>
          <p class="sub">PNG images placed on site sections — flowers, illustrations, textures</p>
        </div>
        <button class="btn btn-primary" id="add-dec-btn">+ Add Decoration</button>
      </div>
      <div id="decorations-grid" class="decorations-grid"></div>
    </section>

    <!-- SETTINGS -->
    <section class="section" id="section-settings">
      <div class="section-head">
        <div>
          <h1>Settings</h1>
          <p class="sub">Site information and integrations</p>
        </div>
        <button class="btn btn-primary" id="save-settings-btn">Save Settings</button>
      </div>
      <div id="settings-form"></div>
    </section>

    <!-- UPLOAD TOOL -->
    <section class="section" id="section-upload">
      <div class="section-head">
        <div>
          <h1>Upload Tool</h1>
          <p class="sub">Compress images and upload to imgBB for a hosted URL</p>
        </div>
      </div>
      <div id="upload-tool-content"></div>
    </section>

  </main>
</div>

<!-- ─── MODAL ─────────────────────────────────────────── -->
<div class="modal-backdrop" id="modal">
  <div class="modal-card" id="modal-card">
    <!-- populated by JS -->
  </div>
</div>

<!-- ─── TOASTS ────────────────────────────────────────── -->
<div class="toast-container" id="toasts"></div>

<script src="js/admin.js"></script>
</body>
</html>
