<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login · Warqaa Nazar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Space+Mono:wght@400&display=swap"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#F5F0EA;--card:#fff;--border:#D4C9BD;--terra:#8C4A26;--cream:#1A1410;--muted:#7A6E64;--error:#B84040;--r:3px}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:'Space Mono',monospace}
    .card{width:100%;max-width:380px;padding:48px 40px;background:var(--card);border:1px solid var(--border)}
    .logo{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:28px;color:var(--cream);text-align:center;margin-bottom:4px}
    .sub{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:32px}
    .notice{font-size:11px;color:var(--muted);text-align:center;line-height:1.6;margin-bottom:24px;padding:12px;border:1px solid var(--border);border-radius:var(--r)}
    label{display:block;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
    input{display:block;width:100%;padding:11px 14px;font-family:'Space Mono',monospace;font-size:13px;color:var(--cream);background:var(--bg);border:1px solid var(--border);border-radius:var(--r);outline:none;margin-bottom:16px;transition:border-color .2s}
    input:focus{border-color:var(--terra)}
    .btn{width:100%;padding:12px;background:var(--cream);color:var(--bg);border:none;border-radius:var(--r);font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:opacity .2s;margin-top:4px}
    .btn:hover{opacity:.85} .btn:disabled{opacity:.4;cursor:not-allowed}
    .error{font-size:11px;color:var(--error);margin-top:14px;text-align:center;display:none}
    .error.show{display:block}
    .not-configured{background:#fff8f5;border:1px solid #e8c4a0;padding:16px;border-radius:var(--r);font-size:11px;line-height:1.7;color:#7A4020;margin-top:8px;display:none}
    .not-configured code{background:#f5e8df;padding:1px 5px;border-radius:2px;font-size:10px}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">Warqaa Nazar</div>
  <div class="sub">Admin Panel</div>

  <div class="not-configured" id="not-cfg">
    Supabase is not configured yet. Open
    <code>js/supabase-client.js</code> and replace
    <code>YOUR_PROJECT_ID</code> and <code>YOUR_ANON_PUBLIC_KEY_HERE</code>
    with your values from the Supabase dashboard.
  </div>

  <form id="form">
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" autocomplete="email" placeholder="you@example.com"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="pw" autocomplete="current-password" placeholder="Your password"/>
    </div>
    <button type="submit" class="btn" id="submit-btn">Sign in</button>
    <p class="error" id="err"></p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase-client.js"></script>
<script>
(function() {
  if (!supabaseClient) {
    document.getElementById('not-cfg').style.display = '';
    document.getElementById('form').style.opacity = '0.4';
    document.getElementById('form').style.pointerEvents = 'none';
    return;
  }

  /* If already signed in, go straight to dashboard */
  supabaseClient.auth.getSession().then(function(r) {
    if (r.data && r.data.session) window.location.href = '/admin/';
  });

  document.getElementById('form').addEventListener('submit', async function(e) {
    e.preventDefault();
    var btn = document.getElementById('submit-btn');
    var err = document.getElementById('err');
    err.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    var email = document.getElementById('email').value.trim();
    var pw    = document.getElementById('pw').value;

    var result = await supabaseClient.auth.signInWithPassword({ email: email, password: pw });

    if (result.error) {
      err.textContent = result.error.message || 'Sign in failed. Check your email and password.';
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Sign in';
    } else {
      window.location.href = '/admin/';
    }
  });
})();
</script>
</body>
</html>
