<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Essays by Warqaa Nazar. Writing on design psychology, political philosophy, heritage, and the architecture of belonging."/>
  <title>Essays · Warqaa Nazar</title>
  <!-- restore theme: URL param takes priority so navigation carries it reliably -->
  <script>(function(){var p=(location.search.match(/[?&]theme=(dark|light)/)||[])[1];var s=null;try{s=localStorage.getItem('warqaa-theme');}catch(e){}var t=p||s;if(t==='dark')document.documentElement.setAttribute('data-theme','dark');try{if(p&&p!==s)localStorage.setItem('warqaa-theme',p);}catch(e){}})();</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/essays.css"/>
  <link rel="stylesheet" href="css/editor.css"/>
</head>
<body class="essays-page">

  <!-- ─── NAV ───────────────────────────────────────── -->
  <header>
    <nav class="nav" aria-label="Primary navigation">
      <a class="nav-home" href="index.html">Warqaa Nazar</a>
      <ul class="nav-links">
        <li><a href="essays.html">Essays</a></li>
        <li><a href="designs.html">Designs</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <!-- ─── PAGE HEADER ─────────────────────────────── -->
    <div class="essays-header" data-zone="essays-header">
      <p class="section-label" data-reveal>writing</p>
      <h1 class="essays-page-title" data-reveal="delay-1">Essays</h1>
      <p class="essays-page-subtitle" data-reveal="delay-2">
        On spaces, politics, and the architecture of belonging.
      </p>
    </div>

    <!-- ─── LAYOUT ──────────────────────────────────── -->
    <div class="essays-layout">

      <!-- ─── FILTER SIDEBAR ────────────────────────── -->
      <aside class="filter-sidebar" aria-label="Filter essays">
        <p class="filter-label">filter</p>
        <ul class="filter-list" role="list">
          <li
            class="filter-option active"
            data-filter="all"
            role="button"
            tabindex="0"
            aria-pressed="true"
            aria-label="Show all essays"
          >
            <span class="filter-radio" aria-hidden="true"></span>
            <span class="filter-option-text">All essays</span>
          </li>
          <li
            class="filter-option"
            data-filter="general"
            role="button"
            tabindex="0"
            aria-pressed="false"
            aria-label="Show general essays"
          >
            <span class="filter-radio" aria-hidden="true"></span>
            <span class="filter-option-text">General</span>
          </li>
          <li
            class="filter-option"
            data-filter="design"
            role="button"
            tabindex="0"
            aria-pressed="false"
            aria-label="Show design essays"
          >
            <span class="filter-radio" aria-hidden="true"></span>
            <span class="filter-option-text">Design</span>
          </li>
        </ul>
      </aside>

      <!-- ─── ESSAY LIST ─────────────────────────────── -->
      <section aria-label="Essay list">

        <ol class="essay-list" id="dynamic-essay-list" role="list">
              <!-- rendered by essays.js from Supabase -->
            </ol>

        <p class="no-results" aria-live="polite">No essays in this category yet.</p>

      </section>

    </div>

  </main>

  <!-- ─── READING OVERLAY ──────────────────────────────── -->
  <!--
    Populated dynamically by essays.js when an essay title is clicked.
    The inner content is replaced on each open.
  -->
  <div
    class="reading-overlay"
    role="dialog"
    aria-modal="true"
    aria-label="Essay reading view"
    tabindex="-1"
  >
    <div class="reading-progress" aria-hidden="true"></div>
    <button class="reading-close" aria-label="Close essay">&#215;</button>
    <div class="reading-overlay-inner"></div>
  </div>

  <script src="js/decorations.js"></script>
  <script src="js/main.js"></script>
  <script src="js/essays.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
